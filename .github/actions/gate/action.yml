name: gate
description: Runs the checks in the repo's gate.toml and writes the summary.
inputs:
  checks: { description: Check names separated by spaces or new lines; empty runs the whole list, default: "" }
runs:
  using: composite
  steps:
    # GitHub fetches this whole repo at the pinned commit, so the script is
    # two folders up. The input reaches bash through env:, never ${{ }}.
    - shell: bash
      env:
        INPUT_CHECKS: ${{ inputs.checks }}
      run: |
        # -d '' reads every line; read then ends at end of input with status 1.
        read -rd '' -a names <<<"$INPUT_CHECKS" || true
        python3 "$GITHUB_ACTION_PATH/../../scripts/gate.py" "${names[@]}"
