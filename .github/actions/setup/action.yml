name: setup
description: Toolchains and the env input for Phlares/workflows jobs.
inputs:
  node-version: { description: Node version; empty skips Node, default: "" }
  python-version: { description: Python version; empty skips Python, default: "" }
  zig-version: { description: Zig version; empty skips Zig, default: "" }
  uv-version: { description: uv version; empty skips uv, default: "" }
  prek-cache: { description: Cache the prek store; for jobs that run prek, default: "false" }
  working-directory: { description: Folder holding the lock files, default: "." }
  env: { description: KEY=VALUE lines, default: "" }
runs:
  using: composite
  steps:
    - if: inputs.node-version != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - if: inputs.python-version != ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        # uv jobs keep their own cache; an empty pip cache only warns.
        cache: ${{ inputs.uv-version == '' && 'pip' || '' }}
        cache-dependency-path: |
          ${{ inputs.working-directory }}/pyproject.toml
          ${{ inputs.working-directory }}/requirements*.txt
    - if: inputs.zig-version != ''
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: ${{ inputs.zig-version }}
    - if: inputs.uv-version != ''
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock
    - if: inputs.prek-cache == 'true'
      shell: bash
      run: echo "PREK_HOME=$RUNNER_TEMP/prek" >> "$GITHUB_ENV"
    # No restore-keys: a near match would be saved again under the new key
    # with stale hook envs.
    - if: inputs.prek-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/prek
        key: prek-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python-version }}-${{ hashFiles(format('{0}/.pre-commit-config.yaml', inputs.working-directory), format('{0}/uv.lock', inputs.working-directory)) }}
    # Not $GITHUB_ENV: the runner refuses NODE_OPTIONS there. env.sh is for
    # shell steps; env.json is for Claude Code settings in claude-fix.yml.
    - name: env
      shell: bash
      env:
        INPUT_ENV: ${{ inputs.env }}
      run: |
        lines=()
        while IFS= read -r line || [ -n "$line" ]; do
          line=${line%$'\r'}
          case $line in
            *[![:space:]]*) ;;
            *) continue ;;
          esac
          case $line in
            '#'*) ;;
            [A-Za-z_]*=*) lines+=("$line") ;;
            *) echo "env input: not KEY=VALUE: $line" | tee -a "$RUNNER_TEMP/run.log" >&2; exit 1 ;;
          esac
        done <<<"$INPUT_ENV"
        for l in "${lines[@]}"; do printf 'export %q\n' "$l"; done > "$RUNNER_TEMP/env.sh"
        jq -n '$ARGS.positional | map(index("=") as $i | {key: .[:$i], value: .[$i + 1:]}) | from_entries' \
          --args "${lines[@]}" > "$RUNNER_TEMP/env.json"
