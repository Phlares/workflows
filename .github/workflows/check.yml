name: check

# Reusable check job. Callers decide what runs and when; this file decides
# how: toolchains, install, shards, time limit, failure report. Inputs reach
# bash through env:, never through ${{ }} inside a script, so caller text
# with quotes or $ cannot inject expressions.
on:
  workflow_call:
    inputs:
      name: { type: string, default: check }
      runs-on: { type: string, default: ubuntu-latest }
      node-version: { type: string, default: "" }
      python-version: { type: string, default: "" }
      zig-version: { type: string, default: "" }
      working-directory: { type: string, default: "." }
      install: { type: string, default: "" }
      run: { type: string, required: true }
      env: { type: string, default: "" }
      shards: { type: string, default: "[1]" }
      timeout-minutes: { type: number, default: 15 }

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.name }} (${{ matrix.shard }})
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    defaults:
      run:
        shell: bash
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
      # Piped Python output is block-buffered; a killed test would lose its tail.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A called workflow resolves ./ against the caller's repo, so fetch this
      # repo at the called commit. Sparse: callers' test globs must not see
      # fixtures. After the caller checkout: checkout empties its target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Phlares/workflows
          ref: ${{ job.workflow_sha }}
          path: .wf
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/
            /.github/scripts/
          sparse-checkout-cone-mode: false
      - run: echo /.wf/ >> .git/info/exclude
      - uses: ./.wf/.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          python-version: ${{ inputs.python-version }}
          zig-version: ${{ inputs.zig-version }}
          working-directory: ${{ inputs.working-directory }}
          env: ${{ inputs.env }}
      # Step-level limits: a job-level timeout cancels the job, and a
      # cancelled job skips the failure report.
      - name: install
        if: inputs.install != ''
        timeout-minutes: ${{ inputs.timeout-minutes }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUT_INSTALL: ${{ inputs.install }}
        run: |
          echo install > "$RUNNER_TEMP/step"
          . "$RUNNER_TEMP/env.sh"
          bash -eo pipefail -c "$INPUT_INSTALL" 2>&1 | tee -a "$RUNNER_TEMP/run.log"
      - name: run
        timeout-minutes: ${{ inputs.timeout-minutes }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUT_RUN: ${{ inputs.run }}
        run: |
          echo run > "$RUNNER_TEMP/step"
          . "$RUNNER_TEMP/env.sh"
          bash -eo pipefail -c "$INPUT_RUN" 2>&1 | tee -a "$RUNNER_TEMP/run.log"
      - name: failure report
        id: report
        if: failure()
        env:
          NAME: ${{ inputs.name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .wf/.github/scripts/check-report.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.report.outputs.artifact }}
          path: ${{ runner.temp }}/report/report.json
          if-no-files-found: ignore
          overwrite: true
