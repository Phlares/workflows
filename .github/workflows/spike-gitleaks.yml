name: spike-gitleaks
on:
  push:
    branches: [spike/gitleaks-34]
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - run: pipx install prek==0.5.5 && prek --version && (which go && go version || echo "no system go")
      - name: scratch repo
        run: |
          mkdir t && cd t && git init -q
          git config user.email s@x && git config user.name s
          cat > .pre-commit-config.yaml <<'EOF'
          repos:
            - repo: https://github.com/gitleaks/gitleaks
              rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
              hooks:
                - id: gitleaks
                - id: gitleaks
                  alias: gitleaks-history
                  entry: gitleaks git --redact --verbose
                  stages: [manual]
          EOF
          echo hello > a.txt && git add -A && git commit -q -m init
      - name: cold build (clean tree passes)
        working-directory: t
        run: time prek run --all-files -v
      - name: seeded staged key fails
        working-directory: t
        run: |
          python3 -c "import secrets,string;print('token = \"ghp_'+''.join(secrets.choice(string.ascii_letters+string.digits) for _ in range(36))+'\"')" > key.py
          git add key.py
          if prek run --all-files; then echo "UNEXPECTED PASS"; exit 1; fi
          echo "staged key blocked"
      - name: committed key, CI view
        working-directory: t
        run: |
          git -c core.hooksPath=/dev/null commit -q -m key
          prek run --all-files && echo "default stage passes on committed key (gap)"
          if prek run --all-files --hook-stage manual; then echo "UNEXPECTED PASS"; exit 1; fi
          echo "manual history stage blocked"
      - name: depth-1 clone sees tree
        run: |
          git clone -q --depth 1 "file://$PWD/t" t1 && cd t1
          if prek run --all-files --hook-stage manual; then echo "UNEXPECTED PASS"; exit 1; fi
          echo "depth-1 history stage blocked"
      - name: prek store size
        run: |
          du -sh ~/.cache/prek ~/.cache/prek/* 2>/dev/null; du -sh ~/go/pkg/mod 2>/dev/null || true
          go env GOMODCACHE GOCACHE; du -sh "$(go env GOMODCACHE)" "$(go env GOCACHE)" 2>/dev/null || true
          tar -czf /tmp/p.tgz -C ~/.cache prek && ls -lh /tmp/p.tgz
          prek cache gc -v 2>&1 | tail -3; du -sh ~/.cache/prek
