name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    uses: ./.github/workflows/check.yml
    with:
      name: js
      node-version: "24"
      working-directory: fixtures/js
      install: npm ci
      run: |
        test "$SHARD_TOTAL" = 2
        node --test --test-shard="$SHARD_INDEX/$SHARD_TOTAL"
      shards: "[1,2]"

  js-sub:
    uses: ./.github/workflows/check.yml
    with:
      name: js-sub
      node-version: "24"
      working-directory: fixtures/js-sub/app
      # NODE_OPTIONS is the one variable the runner refuses in $GITHUB_ENV.
      env: |
        NODE_OPTIONS=--max-old-space-size=1234

        # comment lines and blank lines are skipped
        SPACED=a b  c
      install: npm ci
      run: |
        test "$NODE_OPTIONS" = "--max-old-space-size=1234"
        test "$SPACED" = "a b  c"
        npm test

  # Both workflows fetch this repo into .wf/ at the called commit. Callers'
  # test and lint globs must not see fixtures, and git status stays clean.
  setup-composite:
    uses: ./.github/workflows/check.yml
    with:
      name: setup-composite
      env: COMPOSITE=ok
      run: |
        test "$COMPOSITE" = ok
        test "$(jq -r .COMPOSITE "$RUNNER_TEMP/env.json")" = ok
        test "$(git -C .wf rev-parse HEAD)" = "$GITHUB_SHA"
        test -f .wf/.github/actions/setup/action.yml
        test -z "$(find .wf -path .wf/.git -prune -o -type f -print | grep -vE '^\.wf/\.github/(actions|scripts)/')"
        test -z "$(git status --porcelain)"

  py-zig:
    uses: ./.github/workflows/check.yml
    with:
      name: py-zig
      runs-on: windows-latest
      python-version: "3.12"
      zig-version: 0.16.0
      working-directory: fixtures/py-zig
      env: FIXTURE_ENV=ok
      install: pip install -r requirements.txt
      run: |
        test "$FIXTURE_ENV" = "ok"
        mkdir -p zig-out
        zig build-exe hello.zig -femit-bin=zig-out/hello.exe
        pytest -q -m "not slow and not audio_hw"

  fail:
    uses: ./.github/workflows/check.yml
    with:
      name: fail
      node-version: "24"
      working-directory: fixtures/fail
      install: npm ci
      run: |
        printf '\033[31mcoloured\033[0m\n'
        npm test

  fail-win:
    uses: ./.github/workflows/check.yml
    with:
      name: fail-win
      runs-on: windows-latest
      node-version: "24"
      working-directory: fixtures/fail
      install: npm ci
      run: npm test

  fail-install:
    uses: ./.github/workflows/check.yml
    with:
      name: fail-install
      node-version: "24"
      working-directory: fixtures/fail-install
      install: npm ci
      run: echo "never reached"

  fail-setup:
    uses: ./.github/workflows/check.yml
    with:
      name: fail-setup
      env: not a pair
      run: echo "never reached"

  # Characters that break artifact names and annotation titles, a text shard,
  # and a code fence in the tail.
  fail-odd:
    uses: ./.github/workflows/check.yml
    with:
      name: "odd/name: x, y"
      shards: '["a"]'
      run: |
        echo '```'
        echo "odd failure"
        exit 1

  timeout:
    uses: ./.github/workflows/check.yml
    with:
      name: timeout
      timeout-minutes: 1
      run: |
        echo "started sleep"
        sleep 300

  # A failed job outside check.yml: no report.json, so fix-collect falls back
  # to its log.
  fail-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "raw failure marker"
          exit 1

  fix-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: for t in tests/*.test.sh; do bash "$t" || exit 1; done

  fix-collect:
    if: always()
    needs: [fail, fail-raw]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/fix-collect.sh "$GITHUB_REPOSITORY" "$RUNNER_TEMP/out" "$GITHUB_RUN_ID"
          cd "$RUNNER_TEMP/out"
          jq -e '.schema == 1 and .job == "fail"' ci-failure-fail-1/report.json
          raw=$(grep -lx '# fail-raw' log-*.txt)
          grep -q 'raw failure marker' "$raw"
          # set -e skips a command negated with !, so this must stay the last line.
          ! grep -qx '# fail / fail (1)' log-*.txt

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
          shellcheck -x -P SCRIPTDIR .github/scripts/*.sh tests/*.sh tests/fake-gh
          python3 .github/scripts/suppressions.py
          # Dependabot does not read this pin; bump it by hand.
          pipx run ruff==0.17.1 check .github/scripts
          pipx run ruff==0.17.1 format --check .github/scripts

  # GitHub cannot mark a reusable-workflow job "expected to fail", so this job
  # checks that the fail cases failed and that their reports are well formed.
  # It is the one required check on main.
  verify:
    if: always()
    needs: [js, js-sub, setup-composite, py-zig, fail, fail-win, fail-install, fail-setup, fail-odd, timeout, fail-raw, fix-unit, fix-collect, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .js.result == "success" and ."js-sub".result == "success" and ."setup-composite".result == "success" and
            ."py-zig".result == "success" and .lint.result == "success" and
            .fail.result == "failure" and ."fail-win".result == "failure" and
            ."fail-install".result == "failure" and ."fail-setup".result == "failure" and
            ."fail-odd".result == "failure" and .timeout.result == "failure" and
            ."fail-raw".result == "failure" and ."fix-unit".result == "success" and ."fix-collect".result == "success"' <<<"$NEEDS"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-failure-*
          path: reports
      - env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          check() { # $1 artifact job name, $2 expected step, $3 text expected in tail
            jq -e --arg job "$1" --arg step "$2" --arg text "$3" '
              .schema == 1 and .job == $job and .shard == 1 and .shard_total == 1 and
              .repo == env.GITHUB_REPOSITORY and .pr == (env.PR | if . == "" then null else tonumber end) and
              .step == $step and (.run_url | startswith("https://github.com/")) and
              (.sha | length == 40) and (.tail | any(contains($text))) and
              (.tail | all(contains("\u001b") | not))' "reports/ci-failure-$1-1/report.json"
          }
          check fail run "expected failure from fixture"
          check fail run "coloured"
          check fail-win run "expected failure from fixture"
          check fail-install install "npm error"
          check timeout run "started sleep"
          check fail-setup setup "not KEY=VALUE"
          jq -e '.job == "odd/name: x, y" and .shard == "a" and .shard_total == 1 and .step == "run" and
            (.tail | index("odd failure")) != null' reports/ci-failure-odd-name--x--y-a/report.json
          test "$(find reports -mindepth 1 -maxdepth 1 | wc -l)" = 6
          annotated() { # $1 job display name, $2 jq test on its check.yml annotation
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"$1\") | .id")
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" | jq -e "any(.[]; $2)"
          }
          # The first failure line, not the last line of the tail ("}").
          annotated "fail / fail (1)" '.title == "fail (shard 1/1)" and (.message | startswith("✖ always fails"))'
          annotated "fail-odd / odd/name: x, y (a)" '.title == "odd/name: x, y (shard a/1)" and .message == "odd failure"'
