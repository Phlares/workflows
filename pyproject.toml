# Packages .github/scripts/suppressions.py for the prek hook in
# .pre-commit-hooks.yaml. Nothing else in this repo is Python.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phlares-suppressions"
version = "1.6.0"
requires-python = ">=3.10"
scripts = { suppressions = "suppressions:main" }

[tool.setuptools]
py-modules = ["suppressions"]
package-dir = { "" = ".github/scripts" }
